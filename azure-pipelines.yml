trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# CI: Build & Push
- task: Docker@2
  displayName: Build and Push Image
  inputs:
    containerRegistry: 'gebreluademoacr'
    repository: 'devops-demo'
    command: 'buildAndPush'
    Dockerfile: 'Dockerfile'
    tags: |
      v1

# CD: Deploy to AKS
- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: 'aks-devops-demo-connection'
    namespace: 'default'
    manifests: |
      deployment.yaml
      service.yaml
